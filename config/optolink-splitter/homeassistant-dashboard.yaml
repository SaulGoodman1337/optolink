                      **Funktion:** Pumpenstillstandzeit nach einer Sollwertänderung des Heizkreises durch Betriebsartwechsel oder Änderung der Raum-Solltemperatur.

                      **Bereich:** 0–15 min

                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_pumpe_reduziert_a9_einstellung') }} min

