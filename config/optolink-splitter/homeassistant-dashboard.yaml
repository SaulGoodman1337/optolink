                "y": |
                  $ex {
                    const value = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_max_c6_einstellung'
                      ]?.state
                    );

                    if (!Number.isFinite(value)) {
                      return [null, null];
                    }

                    return [value, value];
