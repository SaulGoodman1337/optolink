views:
  - title: Heizung
    path: heizung
    icon: mdi:water-boiler
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Vitodens 200-W WB2A
            heading_style: title
            icon: mdi:fire-circle
            badges:
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_feuerungsautomat_verriegelt
                name: Störung
                icon: mdi:alert-circle
                show_state: true
                show_icon: true
                visibility:
                  - condition: state
                    entity: binary_sensor.vitodens_200_wb2a_feuerungsautomat_verriegelt
                    state: "on"
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_brenner_flamme
                name: Brenner
                icon: mdi:gas-burner
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.vitodens_200_wb2a_brenner_modulationsgrad
                name: Leistung
                icon: mdi:gauge
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.vitodens_200_wb2a_geblaesedrehzahl
                name: Gebläse
                icon: mdi:fan
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.vitodens_200_wb2a_aussentemperatur
                name: Außen
                icon: mdi:thermometer
                show_state: true
                show_icon: true
          - type: heading
            heading: Temperaturen
            heading_style: subtitle
            icon: mdi:thermometer-lines
            badges:
              - type: entity
                entity: sensor.vitodens_200_wb2a_kesseltemperatur
                name: Kessel
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_heizkreis_m1_vorlauftemperatur
                name: Vorlauf
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_heizkreis_m1_vorlaufsolltemperatur
                name: VL Soll
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_warmwasser_temperatur
                name: WW
                show_state: true
                show_icon: false
          - type: heading
            heading: Anlagenstatus
            heading_style: subtitle
            icon: mdi:state-machine
            badges:
              - type: entity
                entity: sensor.vitodens_200_wb2a_heizkreis_m1_betriebsart_aktuell
                name: Betrieb
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_heizkreis_m1_betriebsprogramm_aktuell
                name: Programm
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_umschaltventil_stellung
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_warmwasser_ladestatus
                name: WW-Ladung
                show_state: true
                show_icon: false
          - type: heading
            heading: Pumpen
            heading_style: subtitle
            icon: mdi:pump
            badges:
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_heizkreis_m1_pumpe_ausgang
                name: Heizkreis
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.vitodens_200_wb2a_heizkreis_m1_pumpe_drehzahl
                name: HK %
                show_state: true
                show_icon: false
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_interne_pumpe_status
                name: Intern
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.vitodens_200_wb2a_interne_pumpe_drehzahl
                name: Intern %
                show_state: true
                show_icon: false
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_zirkulationspumpe_status
                name: Zirkulation
                show_state: true
                show_icon: true
          - type: heading
            heading: Verbrauch & Zähler
            heading_style: subtitle
            icon: mdi:counter
            badges:
              - type: entity
                entity: sensor.heizung_power
                name: Strom
                icon: mdi:lightning-bolt
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.heizung_power_durchschnitt
                name: Ø Strom
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_brenner_starts
                name: Starts
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_brenner_betriebsstunden
                name: Stunden
                show_state: true
                show_icon: false

      - type: grid
        cards:
          - type: heading
            heading: Steuerung
            heading_style: title
            icon: mdi:remote
          - type: custom:mushroom-select-card
            entity: select.vitodens_200_wb2a_heizkreis_m1_betriebsart
            name: Betriebsart
            icon: mdi:home-modern
            grid_options:
              columns: 12
              rows: 2
          - type: heading
            heading: Raumtemperatur
            heading_style: subtitle
            icon: mdi:home-thermometer-outline
          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_raumsolltemperatur_normal
            name: Tagestemperatur
            icon: mdi:sun-thermometer
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_raumsolltemperatur_reduziert
            name: Nachttemperatur
            icon: mdi:weather-night
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 12
              rows: 2
          - type: heading
            heading: Warmwasser
            heading_style: subtitle
            icon: mdi:water-thermometer
            badges:
              - type: entity
                entity: sensor.vitodens_200_wb2a_warmwasser_temperatur
                name: Ist
                show_state: true
                show_icon: false
          - type: tile
            entity: number.vitodens_200_wb2a_warmwasser_solltemperatur
            name: Warmwasser Soll
            icon: mdi:water-thermometer
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 12
              rows: 2
          - type: heading
            heading: Komfort
            heading_style: subtitle
            icon: mdi:party-popper
          - type: tile
            entity: switch.vitodens_200_wb2a_heizkreis_m1_partybetrieb
            name: Partybetrieb
            icon: mdi:party-popper
            tap_action:
              action: toggle
            features:
              - type: toggle
            features_position: bottom
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_raumsolltemperatur_party
            name: Partytemperatur
            icon: mdi:thermometer-plus
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: switch.vitodens_200_wb2a_heizkreis_m1_partybetrieb
                state: "on"
          - type: custom:mushroom-select-card
            entity: select.vitodens_200_wb2a_zirkulation_intervall
            name: Zirkulation
            icon: mdi:pump
            grid_options:
              columns: 12
              rows: 2

      - type: grid
        cards:
          - type: heading
            heading: Thermostatventile
            heading_style: title
            icon: mdi:hvac
            badges:
              - type: entity
                entity: sensor.thermostat_ventiloffnung
                name: Durchschnitt
                icon: mdi:percent
                show_state: true
                show_icon: true
          - type: heading
            heading: Büro
            heading_style: subtitle
            icon: mdi:briefcase
            badges:
              - type: entity
                entity: sensor.buro_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperaturzielburo
                name: Soll
                show_state: true
                show_icon: false
          - type: heading
            heading: Dario
            heading_style: subtitle
            icon: mdi:baby-face-outline
            badges:
              - type: entity
                entity: sensor.dario_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperatur_wohnbereich_temperature
                name: Ist
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperaturzieldario
                name: Soll
                show_state: true
                show_icon: false
          - type: heading
            heading: Schlafzimmer
            heading_style: subtitle
            icon: mdi:bed
            badges:
              - type: entity
                entity: sensor.schlafzimmer_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperatur_schlafzimmer_temperature
                name: Ist
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperaturzielschlafzimmer
                name: Soll
                show_state: true
                show_icon: false
          - type: heading
            heading: Gäste-WC
            heading_style: subtitle
            icon: mdi:toilet
            badges:
              - type: entity
                entity: sensor.gaste_wc_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperaturzielgastewc
                name: Soll
                show_state: true
                show_icon: false
          - type: heading
            heading: Badezimmer
            heading_style: subtitle
            icon: mdi:bathtub
            badges:
              - type: entity
                entity: sensor.badezimmer_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: climate.badezimmer
                name: Klima
                show_state: true
                show_icon: true
          - type: heading
            heading: Wohnzimmer
            heading_style: subtitle
            icon: mdi:sofa
            badges:
              - type: entity
                entity: sensor.wohnzimmer_links_ventil_offnungsgrad
                name: Links
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.wohnzimmer_rechts_ventil_offnungsgrad
                name: Rechts
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperatursensorwohnzimmer_temperatur
                name: Ist
                show_state: true
                show_icon: false
          - type: heading
            heading: Flur
            heading_style: subtitle
            icon: mdi:door
            badges:
              - type: entity
                entity: sensor.flur_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.flurtemperatur_flur_temperature
                name: Ist
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperaturzielflur
                name: Soll
                show_state: true
                show_icon: false
          - type: tile
            entity: script.climateboost
            name: Alle Ventile öffnen
            icon: mdi:heating-coil
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.climateboost
              target: {}
            grid_options:
              columns: 12
              rows: 1

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Verlauf
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            title: Heizung – 48 Stunden
            hours_to_show: 48
            entities:
              - sensor.vitodens_200_wb2a_aussentemperatur_gedaempft
              - sensor.vitodens_200_wb2a_heizkreis_m1_vorlaufsolltemperatur
              - sensor.vitodens_200_wb2a_heizkreis_m1_vorlauftemperatur
              - sensor.vitodens_200_wb2a_kesseltemperatur
              - binary_sensor.vitodens_200_wb2a_brenner_flamme
              - sensor.vitodens_200_wb2a_brenner_modulationsgrad
              - sensor.ventilstellung_durchschnitt
            grid_options:
              columns: full
    cards: []
    header:
      layout: responsive
      badges_position: bottom
      badges_wrap: wrap

  - title: Heizkurve
    path: heizkurve
    icon: mdi:chart-bell-curve
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Heizkurve & Vorlauf
            heading_style: title
            icon: mdi:chart-bell-curve
            badges:
              - type: entity
                entity: sensor.vitodens_200_wb2a_aussentemperatur_gedaempft
                name: Außen
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_heizkreis_m1_vorlaufsolltemperatur
                name: Soll
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_heizkreis_m1_vorlauftemperatur
                name: Ist
                show_state: true
                show_icon: false
          - type: custom:plotly-graph
            raw_plotly_config: true
            refresh_interval: 5
            disable_pinch_to_zoom: true
            config:
              displayModeBar: false
              scrollZoom: false
              doubleClick: false
              responsive: true
            defaults:
              entity:
                showlegend: true
            layout:
              height: 430
              margin:
                l: 55
                r: 35
                t: 20
                b: 70
              hovermode: closest
              hoverdistance: 100
              showlegend: true
              dragmode: false
              legend:
                orientation: h
                x: 0
                "y": -0.18
              xaxis:
                title:
                  text: Außentemperatur °C
                range:
                  - 20
                  - -30
                dtick: 5
                showgrid: true
                zeroline: true
                zerolinewidth: 1
                fixedrange: true
              yaxis:
                title:
                  text: Vorlauftemperatur °C
                dtick: 5
                showgrid: true
                zeroline: false
                fixedrange: true
                range: |
                  $ex {
                    const c5 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_min_c5_einstellung'
                      ]?.state
                    );

                    const c6 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_max_c6_einstellung'
                      ]?.state
                    );

                    const ist = Number(
                      hass.states[
                        'sensor.vitodens_200_wb2a_heizkreis_m1_vorlauftemperatur'
                      ]?.state
                    );

                    const values = [c5, c6, ist]
                      .filter(v => Number.isFinite(v));

                    if (!values.length) {
                      return [20, 80];
                    }

                    const minValue = Math.min(...values);
                    const maxValue = Math.max(...values);

                    return [
                      Math.max(
                        0,
                        Math.floor((minValue - 10) / 5) * 5
                      ),
                      Math.ceil((maxValue + 10) / 5) * 5
                    ];
                  }
            entities:
              - entity: ""
                name: Normal
                mode: lines
                x: |
                  $ex Array.from(
                    { length: 51 },
                    (_, i) => 20 - i
                  )
                "y": |
                  $ex {
                    const neigung = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_heizkennlinie_neigung_d3_einstellung'
                      ]?.state
                    );

                    const niveau = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_heizkennlinie_niveau_d4_einstellung'
                      ]?.state
                    );

                    const raum = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_raumsolltemperatur_normal'
                      ]?.state
                    );

                    const c5 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_min_c5_einstellung'
                      ]?.state
                    );

                    const c6 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_max_c6_einstellung'
                      ]?.state
                    );

                    const outdoorTemps = Array.from(
                      { length: 51 },
                      (_, i) => 20 - i
                    );

                    if (
                      !Number.isFinite(neigung) ||
                      !Number.isFinite(niveau) ||
                      !Number.isFinite(raum) ||
                      !Number.isFinite(c5) ||
                      !Number.isFinite(c6)
                    ) {
                      return outdoorTemps.map(() => null);
                    }

                    return outdoorTemps.map(aussen => {
                      if (aussen >= raum) {
                        return null;
                      }

                      const theoretisch =
                        neigung *
                        1.8317984 *
                        Math.pow(
                          raum - aussen,
                          0.8281902
                        ) +
                        niveau +
                        raum;

                      const begrenzt =
                        Math.min(
                          c6,
                          Math.max(
                            c5,
                            theoretisch
                          )
                        );

                      return Math.ceil(begrenzt * 10) / 10;
                    });
                  }
                line:
                  width: 4
                  shape: spline
                  color: orange
                hovertemplate: >-
                  <b>Normalbetrieb</b><br>
                  Außen: %{x:.0f} °C<br>
                  Vorlauf: %{y:.1f} °C
                  <extra></extra>

              - entity: ""
                name: Reduziert
                mode: lines
                x: |
                  $ex Array.from(
                    { length: 51 },
                    (_, i) => 20 - i
                  )
                "y": |
                  $ex {
                    const neigung = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_heizkennlinie_neigung_d3_einstellung'
                      ]?.state
                    );

                    const niveau = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_heizkennlinie_niveau_d4_einstellung'
                      ]?.state
                    );

                    const raum = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_raumsolltemperatur_reduziert'
                      ]?.state
                    );

                    const c5 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_min_c5_einstellung'
                      ]?.state
                    );

                    const c6 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_max_c6_einstellung'
                      ]?.state
                    );

                    const outdoorTemps = Array.from(
                      { length: 51 },
                      (_, i) => 20 - i
                    );

                    if (
                      !Number.isFinite(neigung) ||
                      !Number.isFinite(niveau) ||
                      !Number.isFinite(raum) ||
                      !Number.isFinite(c5) ||
                      !Number.isFinite(c6)
                    ) {
                      return outdoorTemps.map(() => null);
                    }

                    return outdoorTemps.map(aussen => {
                      if (aussen >= raum) {
                        return null;
                      }

                      const theoretisch =
                        neigung *
                        1.8317984 *
                        Math.pow(
                          raum - aussen,
                          0.8281902
                        ) +
                        niveau +
                        raum;

                      const begrenzt =
                        Math.min(
                          c6,
                          Math.max(
                            c5,
                            theoretisch
                          )
                        );

                      return Math.ceil(begrenzt * 10) / 10;
                    });
                  }
                line:
                  width: 3
                  dash: dot
                  shape: spline
                  color: blue
                hovertemplate: >-
                  <b>Reduzierter Betrieb</b><br>
                  Außen: %{x:.0f} °C<br>
                  Vorlauf: %{y:.1f} °C
                  <extra></extra>

              - entity: ""
                name: C5 Minimum
                mode: lines
                x:
                  - 20
                  - -30
                "y": |
                  $ex {
                    const value = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_min_c5_einstellung'
                      ]?.state
                    );

                    if (!Number.isFinite(value)) {
                      return [null, null];
                    }

                    return [value, value];
                  }
                line:
                  width: 1
                  dash: dash
                  color: gray
                hovertemplate: >-
                  C5 Minimum: %{y:.0f} °C
                  <extra></extra>

              - entity: ""
                name: C6 Maximum
                mode: lines
                x:
                  - 20
                  - -30
                "y": |
                  $ex {
                    const value = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_max_c6_einstellung'
                      ]?.state
                    );

                    if (!Number.isFinite(value)) {
                      return [null, null];
                    }

                    return [value, value];
                  }
                line:
                  width: 1
                  dash: dash
                  color: gray
                hovertemplate: >-
                  C6 Maximum: %{y:.0f} °C
                  <extra></extra>

              - entity: ""
                name: Außen aktuell
                mode: lines
                x: |
                  $ex {
                    const aussen = Number(
                      hass.states[
                        'sensor.vitodens_200_wb2a_aussentemperatur_gedaempft'
                      ]?.state
                    );

                    if (!Number.isFinite(aussen)) {
                      return [];
                    }

                    return [aussen, aussen];
                  }
                "y": |
                  $ex {
                    const c5 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_min_c5_einstellung'
                      ]?.state
                    );

                    const c6 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_max_c6_einstellung'
                      ]?.state
                    );

                    if (
                      !Number.isFinite(c5) ||
                      !Number.isFinite(c6)
                    ) {
                      return [];
                    }

                    return [
                      Math.max(0, c5 - 10),
                      c6 + 10
                    ];
                  }
                line:
                  width: 1
                  dash: dot
                  color: gray
                hovertemplate: >-
                  Außen aktuell: %{x:.1f} °C
                  <extra></extra>

              - entity: ""
                name: Normal aktuell
                mode: markers+text
                x: |
                  $ex {
                    const aussen = Number(
                      hass.states[
                        'sensor.vitodens_200_wb2a_aussentemperatur_gedaempft'
                      ]?.state
                    );

                    const raum = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_raumsolltemperatur_normal'
                      ]?.state
                    );

                    if (
                      !Number.isFinite(aussen) ||
                      !Number.isFinite(raum) ||
                      aussen >= raum
                    ) {
                      return [];
                    }

                    return [aussen];
                  }
                "y": |
                  $ex {
                    const aussen = Number(
                      hass.states[
                        'sensor.vitodens_200_wb2a_aussentemperatur_gedaempft'
                      ]?.state
                    );

                    const neigung = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_heizkennlinie_neigung_d3_einstellung'
                      ]?.state
                    );

                    const niveau = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_heizkennlinie_niveau_d4_einstellung'
                      ]?.state
                    );

                    const raum = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_raumsolltemperatur_normal'
                      ]?.state
                    );

                    const c5 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_min_c5_einstellung'
                      ]?.state
                    );

                    const c6 = Number(
                      hass.states[
                        'number.vitodens_200_wb2a_heizkreis_m1_vorlauf_max_c6_einstellung'
                      ]?.state
                    );

                    if (
                      !Number.isFinite(aussen) ||
                      !Number.isFinite(neigung) ||
                      !Number.isFinite(niveau) ||
                      !Number.isFinite(raum) ||
                      !Number.isFinite(c5) ||
                      !Number.isFinite(c6) ||
                      aussen >= raum
                    ) {
                      return [];
                    }

                    const theoretisch =
                      neigung *
                      1.8317984 *
                      Math.pow(
                        raum - aussen,
