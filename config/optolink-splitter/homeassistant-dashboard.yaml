            name: Minimum E7
            icon: mdi:speedometer-slow
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            tap_action:
              action: more-info
            hold_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Minimale Drehzahl E7
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Untere Drehzahlgrenze der geregelten Heizkreispumpe im normalen Heizbetrieb.

                      **Bereich:** 0–100 %

                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_pumpe_min_drehzahl_e7_einstellung') }} %

                      Die Regelung darf oberhalb von E7 selbst eine höhere Drehzahl vorgeben.

                      **Lokal gemessen:** E7 30 % → reale Drehzahl etwa 32–35 %, E7 60 % → etwa 62 %, E7 100 % → 100 %.

                      Datenpunkt: `0x27E7`
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_pumpe_max_drehzahl_e6_einstellung
            name: Maximum E6
            icon: mdi:speedometer
            show_entity_picture: false
            vertical: false
            features:
