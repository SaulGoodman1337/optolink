    icon: mdi:pump
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Heizkreis & interne Pumpe
            heading_style: title
            icon: mdi:pump
            badges:
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_heizkreis_m1_pumpe_ausgang
                name: HK Ausgang
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.vitodens_200_wb2a_heizkreis_m1_pumpe_drehzahl
                name: HK %
                show_state: true
                show_icon: false
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_interne_pumpe_status
                name: Intern
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.vitodens_200_wb2a_interne_pumpe_drehzahl
                name: Intern %
                show_state: true
                show_icon: false
          - type: heading
            heading: Pumpenparameter
            heading_style: subtitle
            icon: mdi:cog-outline
            badges:
              - type: entity
                entity: sensor.vitodens_200_wb2a_interne_pumpe_kennung_30_anzeige
                name: Pumpentyp
                show_state: true
                show_icon: false
          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_pumpe_min_drehzahl_e7_einstellung
            name: Minimale Drehzahl E7
            icon: mdi:pump
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 10
              rows: 2
          - type: button
            icon: mdi:information-outline
            show_name: false
            show_icon: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Minimale Drehzahl E7
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Untere Drehzahlgrenze der geregelten Heizkreispumpe im normalen Heizbetrieb.
                      
                      **Bereich:** 0–100 %
                      
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_pumpe_min_drehzahl_e7_einstellung') }} %
                      
                      Die Regelung darf oberhalb von E7 selbst eine höhere Drehzahl vorgeben. E7 = 100 % erzwingt zusammen mit E6 = 100 % die maximale Pumpendrehzahl.
                      
                      **Bei dieser WB2A gemessen:** E7 30 % → reale Drehzahl etwa 32–35 %, E7 60 % → etwa 62 %, E7 100 % → 100 %.
                      
                      Datenpunkt: `0x27E7`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_pumpe_max_drehzahl_e6_einstellung
            name: Maximale Drehzahl E6
            icon: mdi:pump
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 10
              rows: 2
          - type: button
            icon: mdi:information-outline
            show_name: false
            show_icon: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Maximale Drehzahl E6
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Obere Drehzahlgrenze der geregelten Heizkreispumpe.
                      
                      **Bereich:** 0–100 %
                      
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_pumpe_max_drehzahl_e6_einstellung') }} %
                      
                      E6 = 100 % bedeutet, dass die Regelung bis 100 % fahren darf. Es bedeutet **nicht**, dass die Pumpe beim Brennerstart automatisch auf 100 % geht.
                      
                      Datenpunkt: `0x27E6`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
          - type: custom:mushroom-select-card
            entity: select.vitodens_200_wb2a_heizkreis_m1_pumpe_nebenbetrieb_e8_einstellung
            name: Pumpendrehzahl reduziert E8
            icon: mdi:pump
            grid_options:
              columns: 10
              rows: 2
          - type: button
            icon: mdi:information-outline
            show_name: false
            show_icon: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Pumpendrehzahl reduziert E8
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Legt fest, welche Pumpendrehzahl im reduzierten Heizbetrieb verwendet wird.
                      
                      **Aktuell:** {{ states('select.vitodens_200_wb2a_heizkreis_m1_pumpe_nebenbetrieb_e8_einstellung') }}
                      
                      - **Minimum nach E7:** Im reduzierten Betrieb gilt die Mindestdrehzahl aus E7.
                      - **Reduziert nach E9:** Im reduzierten Betrieb wird die separate Drehzahl E9 verwendet.
                      
                      E8 ist kein Brennerstart- oder Pumpenboost-Parameter.
                      
                      Datenpunkt: `0x27E8`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_pumpe_reduziert_e9_einstellung
            name: Reduzierte Drehzahl E9
            icon: mdi:pump
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 10
              rows: 2
          - type: button
            icon: mdi:information-outline
            show_name: false
            show_icon: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Reduzierte Drehzahl E9
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Separate Pumpendrehzahl für den reduzierten Heizbetrieb.
                      
                      **Bereich:** 0–100 %
                      
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_pumpe_reduziert_e9_einstellung') }} %
                      
                      E9 wird für diese Funktion nur verwendet, wenn E8 auf **„Reduziert nach E9“** steht.
                      
                      Datenpunkt: `0x27E9`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_pumpe_reduziert_a9_einstellung
            name: Pumpenstillstandzeit A9
            icon: mdi:timer-cog-outline
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 10
              rows: 2
          - type: button
            icon: mdi:information-outline
            show_name: false
            show_icon: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Pumpenstillstandzeit A9
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Pumpenstillstandzeit nach einer Sollwertänderung des Heizkreises.
                      
                      Die Heizkreispumpe wird für die eingestellte Zeit abgeschaltet, wenn sich der Sollwert durch einen **Wechsel der Betriebsart** oder durch eine **Änderung der Raum-Solltemperatur** ändert.
                      
                      **Bereich:** 0–15 min
                      
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_pumpe_reduziert_a9_einstellung') }} min
                      
                      A9 = 0 deaktiviert die Pumpenstillstandzeit. A9 = 1–15 legt die Stillstandzeit in Minuten fest.
                      
                      Datenpunkt: `0x27A9`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
          - type: tile
            entity: number.vitodens_200_wb2a_interne_pumpe_solldrehzahl_31_einstellung
            name: Interne Pumpe Solldrehzahl 31
            icon: mdi:pump
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 10
              rows: 2
          - type: button
            icon: mdi:information-outline
            show_name: false
            show_icon: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Interne Pumpe Solldrehzahl 31
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Konfigurationswert für die Drehzahl der internen Pumpe.
                      
                      **Bereich:** 0–100 %
                      
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_interne_pumpe_solldrehzahl_31_einstellung') }} %
                      
                      **Wichtig bei dieser Anlage:** 31 = 100 % bedeutet nicht automatisch 100 % reale Pumpendrehzahl im Heizbetrieb. Wir haben 31 = 100 % bei gleichzeitig nur etwa 50 % tatsächlicher interner Pumpendrehzahl gemessen.
                      
                      Daher nicht als direkten Laufzeit-Sollwert interpretieren.
                      
                      Datenpunkt: `0x5731`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Warmwasser & Zirkulation
            heading_style: title
            icon: mdi:water-pump
            badges:
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_zirkulationspumpe_status
                name: Zirkulation
                show_state: true
                show_icon: true
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_speicherladepumpe_status
                name: Speicher
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.vitodens_200_wb2a_warmwasser_ladestatus
                name: Ladestatus
                show_state: true
                show_icon: false
          - type: custom:mushroom-select-card
            entity: select.vitodens_200_wb2a_zirkulation_intervall
            name: Zirkulationsmodus
            icon: mdi:clock-outline
          - type: heading
            heading: Regelparameter
            heading_style: subtitle
            icon: mdi:tune-variant
            badges:
              - type: entity
                entity: sensor.vitodens_200_wb2a_warmwasser_sollbereich_56_anzeige
                name: Sollbereich
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_warmwasser_einschalt_offset_59_anzeige
                name: Einschaltpunkt
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_umschaltventil_bauart_65_anzeige
                name: Ventil
                show_state: true
                show_icon: false
          - type: tile
            entity: number.vitodens_200_wb2a_warmwasser_kessel_offset_60_einstellung
            name: Kessel-Offset 60
            icon: mdi:thermometer-plus
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 10
              rows: 2
          - type: button
            icon: mdi:information-outline
            show_name: false
            show_icon: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Kessel-Offset 60
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Überhöhung der Kessel- bzw. Vorlauf-Solltemperatur gegenüber der Warmwasser-Solltemperatur während der Speicherladung.
                      
                      **Bereich:** 5–25 K
                      
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_warmwasser_kessel_offset_60_einstellung') }} K
                      
                      **Beispiel:** Warmwasser-Soll 50 °C + Offset 20 K → Kessel-Soll ungefähr 70 °C während der Warmwasserbereitung.
                      
                      Der Parameter betrifft die Warmwasserbereitung, nicht den normalen Heizbetrieb.
                      
                      Datenpunkt: `0x6760`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
          - type: tile
            entity: number.vitodens_200_wb2a_warmwasser_pumpennachlauf_62_einstellung
            name: Pumpennachlauf 62
            icon: mdi:timer-outline
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 10
              rows: 2
          - type: button
            icon: mdi:information-outline
            show_name: false
            show_icon: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Pumpennachlauf 62
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Nachlaufzeit der Speicherladepumpe nach Ende der Warmwasser-Speicherladung.
                      
                      **Bereich:** 0–15 min
                      
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_warmwasser_pumpennachlauf_62_einstellung') }} min
                      
                      Damit kann nach dem Brennerende noch Wärme aus dem Kessel in den Warmwasserspeicher übertragen werden.
                      
                      Datenpunkt: `0x6762`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
          - type: heading
            heading: Zirkulation bei Warmwasser-Soll
            heading_style: subtitle
            icon: mdi:pump
            badges:
              - type: entity
                entity: sensor.vitodens_200_wb2a_zirkulation_bei_ww_soll1_71_anzeige
                name: Soll 1
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_zirkulation_bei_ww_soll2_72_anzeige
                name: Soll 2
                show_state: true
                show_icon: false
    cards: []

