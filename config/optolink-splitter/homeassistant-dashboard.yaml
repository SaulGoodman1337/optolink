              browser_mod:
                service: browser_mod.popup
                data:
                  title: Reduzierte Drehzahl E9
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Separate Pumpendrehzahl für den reduzierten Heizbetrieb.

                      **Bereich:** 0–100 %

                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_pumpe_reduziert_e9_einstellung') }} %

                      E9 wird verwendet, wenn E8 auf **„Reduziert nach E9“** steht.

                      Datenpunkt: `0x27E9`
            grid_options:
              columns: 6
              rows: 2

          - type: heading
            heading: Zeit / interne Pumpe
            heading_style: subtitle
            icon: mdi:timer-cog-outline

          - type: tile
