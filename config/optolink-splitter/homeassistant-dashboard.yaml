button_card_templates:
  diag_metric:
    section_mode: true
    show_name: true
    show_state: true
    show_icon: true
    show_units: true
    layout: icon_name_state2nd
    size: 22px
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
        - border-radius: 14px
        - border: 1px solid var(--divider-color)
        - box-shadow: none
        - padding: 7px 9px
        - background: var(--ha-card-background, var(--card-background-color))
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 30px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 8px
      img_cell:
        - width: 28px
        - height: 28px
        - justify-content: center
        - align-items: center
      icon:
        - width: 21px
      name:
        - justify-self: start
        - align-self: end
        - color: var(--secondary-text-color)
        - font-size: 11px
        - font-weight: 500
        - line-height: 1.15
        - overflow: hidden
        - text-overflow: ellipsis
        - white-space: nowrap
      state:
        - justify-self: start
        - align-self: start
        - color: var(--primary-text-color)
        - font-size: 15px
        - font-weight: 600
        - line-height: 1.25
        - overflow: hidden
        - text-overflow: ellipsis
        - white-space: nowrap

  diag_metric_compact:
    template: diag_metric
    styles:
      state:
        - font-size: 14px

