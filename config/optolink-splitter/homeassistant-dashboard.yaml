                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Wählt die Pumpendrehzahl im reduzierten Heizbetrieb.

                      - **Minimum nach E7:** Mindestdrehzahl aus E7.
                      - **Reduziert nach E9:** separate Drehzahl E9.

                      E8 ist kein Brennerstart- oder Pumpenboost-Parameter.

                      Datenpunkt: `0x27E8`
            grid_options:
              columns: 6
              rows: 2

          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_pumpe_reduziert_e9_einstellung
            name: Reduziert E9
            icon: mdi:weather-night
            show_entity_picture: false
