                      ) +
                      niveau +
                      raum;

                    const begrenzt =
                      Math.min(
                        c6,
                        Math.max(
                          c5,
                          theoretisch
                        )
                      );

                    return [
                      Math.ceil(begrenzt * 10) / 10
                    ];
