  # - button-card
  # - lovelace-multiple-entity-row
  # - card-mod
  - title: Diagnose
    path: diagnose
    icon: mdi:stethoscope
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Vitodens Diagnose
            heading_style: title
            icon: mdi:stethoscope
            badges:
              - type: entity
                entity: sensor.vitodens_200_wb2a_systemzeit_anzeige
                name: Zeit
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.vitodens_200_wb2a_regelungssoftware_version
                name: SW
                show_state: true
                show_icon: false

          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: binary_sensor.vitodens_200_wb2a_brenner_flamme
                icon: mdi:fire
                content: >-
                  Brenner {{ 'AN' if is_state('binary_sensor.vitodens_200_wb2a_brenner_flamme', 'on') else 'AUS' }}
                icon_color: >-
                  {{ 'orange' if is_state('binary_sensor.vitodens_200_wb2a_brenner_flamme', 'on') else 'grey' }}
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_brenner_modulationsgrad
                icon: mdi:gauge
                content: >-
                  Mod {{ states('sensor.vitodens_200_wb2a_brenner_modulationsgrad') }} %
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_geblaesedrehzahl_gfa_p06
                icon: mdi:fan
                content: >-
                  Gebläse {{ states('sensor.vitodens_200_wb2a_geblaesedrehzahl_gfa_p06') }} rpm
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_gfa_modulationssollwert_p09
                icon: mdi:gauge-full
                content: >-
                  GFA Soll {{ states('sensor.vitodens_200_wb2a_gfa_modulationssollwert_p09') }} %
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_rkr_brennerzustand
                icon: mdi:state-machine
                content: >-
                  RKR {{ states('sensor.vitodens_200_wb2a_rkr_brennerzustand') }}
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_kesseltemperatur
                icon: mdi:thermometer
                content: >-
                  Kessel {{ states('sensor.vitodens_200_wb2a_kesseltemperatur') }} °C
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_rkr_kesselsolltemperatur
                icon: mdi:target
                content: >-
                  OPT {{ states('sensor.vitodens_200_wb2a_rkr_kesselsolltemperatur') }} °C
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_heizkreis_m1_pumpe_drehzahl
                icon: mdi:pump
                content: >-
                  HK {{ states('sensor.vitodens_200_wb2a_heizkreis_m1_pumpe_drehzahl') }} %
                tap_action:
                  action: more-info
              - type: template
                entity: binary_sensor.vitodens_200_wb2a_brenner_taktsperre_aktiv
                icon: mdi:timer-lock
                content: >-
                  Sperre {{ 'AN' if is_state('binary_sensor.vitodens_200_wb2a_brenner_taktsperre_aktiv', 'on') else 'AUS' }}
                icon_color: >-
                  {{ 'amber' if is_state('binary_sensor.vitodens_200_wb2a_brenner_taktsperre_aktiv', 'on') else 'grey' }}
                tap_action:
                  action: more-info
              - type: template
                entity: binary_sensor.vitodens_200_wb2a_brenner_wiederanlauf_freigegeben
                icon: mdi:restart
                content: >-
                  Freigabe {{ 'JA' if is_state('binary_sensor.vitodens_200_wb2a_brenner_wiederanlauf_freigegeben', 'on') else 'NEIN' }}
                icon_color: >-
                  {{ 'green' if is_state('binary_sensor.vitodens_200_wb2a_brenner_wiederanlauf_freigegeben', 'on') else 'grey' }}
                tap_action:
                  action: more-info
              - type: template
                entity: binary_sensor.vitodens_200_wb2a_feuerungsautomat_verriegelt
                icon: mdi:alert-octagon
                content: >-
                  GFA {{ 'VERRIEGELT' if is_state('binary_sensor.vitodens_200_wb2a_feuerungsautomat_verriegelt', 'on') else 'OK' }}
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.vitodens_200_wb2a_feuerungsautomat_verriegelt', 'on') else 'green' }}
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_gfa_status3_p87
                icon: mdi:code-tags
                content: >-
                  P87 {{ states('sensor.vitodens_200_wb2a_gfa_status3_p87') }}
                tap_action:
                  action: more-info
            card_mod:
              style: |
                ha-card {
                  padding: 2px 4px 4px;
                }
            grid_options:
              columns: full

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Feuerungsablauf
            heading_style: subtitle
            icon: mdi:transit-connection-variant

          - type: custom:button-card
            section_mode: true
            show_icon: false
            show_name: false
            show_state: false
            show_ripple: false
            tap_action:
              action: none
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
            styles:
              card:
                - border-radius: 14px
                - border: 1px solid var(--divider-color)
                - box-shadow: none
                - padding: 8px
                - background: var(--ha-card-background, var(--card-background-color))
              grid:
                - grid-template-areas: >-
                    "s1 a1 s2 a2 s3 a3 s4 a4 s5"
                - grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr) 24px minmax(0, 1fr) 24px minmax(0, 1fr) 24px minmax(0, 1fr)
                - grid-template-rows: 1fr
                - align-items: center
              custom_fields:
                a1:
                  - align-self: center
                  - justify-self: stretch
                  - text-align: center
                  - color: var(--secondary-text-color)
                a2:
                  - align-self: center
                  - justify-self: stretch
                  - text-align: center
                  - color: var(--secondary-text-color)
                a3:
                  - align-self: center
                  - justify-self: stretch
                  - text-align: center
                  - color: var(--secondary-text-color)
                a4:
                  - align-self: center
                  - justify-self: stretch
                  - text-align: center
                  - color: var(--secondary-text-color)
            custom_fields:
              s1:
                card:
                  type: custom:button-card
                  template: diag_process_node
                  entity: binary_sensor.vitodens_200_wb2a_brenner_wiederanlauf_freigegeben
                  name: 1 · Freigabe
                  icon: mdi:restart
              a1: <ha-icon icon="mdi:arrow-right-thin"></ha-icon>
              s2:
                card:
                  type: custom:button-card
                  template: diag_process_node
                  entity: binary_sensor.vitodens_200_wb2a_brenner_startphase
                  name: 2 · Startphase
                  icon: mdi:rocket-launch
              a2: <ha-icon icon="mdi:arrow-right-thin"></ha-icon>
              s3:
                card:
                  type: custom:button-card
                  template: diag_process_node
                  entity: binary_sensor.vitodens_200_wb2a_brenner_flamme
                  name: 3 · Flamme
                  icon: mdi:fire
              a3: <ha-icon icon="mdi:arrow-right-thin"></ha-icon>
              s4:
                card:
                  type: custom:button-card
                  template: diag_process_node
                  entity: binary_sensor.vitodens_200_wb2a_brenner_anfahroptimierung_aktiv
                  name: 4 · Anfahr-OPT
                  icon: mdi:chart-timeline-variant-shimmer
              a4: <ha-icon icon="mdi:arrow-right-thin"></ha-icon>
              s5:
                card:
                  type: custom:button-card
                  template: diag_process_node
                  entity: binary_sensor.vitodens_200_wb2a_brenner_regelbetrieb
                  name: 5 · Regelbetrieb
                  icon: mdi:tune-variant
            grid_options:
              columns: full

          - type: custom:button-card
            template: diag_process
            entity: binary_sensor.vitodens_200_wb2a_brenner_wiederanlauf_freigegeben
            name: 1 · Freigabe
            icon: mdi:restart
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_process
            entity: binary_sensor.vitodens_200_wb2a_brenner_startphase
            name: 2 · Startphase
            icon: mdi:rocket-launch
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_process
            entity: binary_sensor.vitodens_200_wb2a_brenner_flamme
            name: 3 · Flamme
            icon: mdi:fire
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_process
            entity: binary_sensor.vitodens_200_wb2a_brenner_anfahroptimierung_aktiv
            name: 4 · Anfahr-OPT
            icon: mdi:chart-timeline-variant-shimmer
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_process
            entity: binary_sensor.vitodens_200_wb2a_brenner_regelbetrieb
            name: 5 · Regelbetrieb
            icon: mdi:tune-variant
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options:
              columns: 12
              rows: 1


      - type: grid
        column_span: 1
        cards:
          - type: custom:background-graph-entities
            title: Brenner / Regelung
            tile_style: true
            hours_to_show: 3
            points_per_hour: 12
            update_interval: 60
            line_width: 2
            line_opacity: 0.24
            line_length: short
            curve: spline
            show_gaps: true
            entities:
              - entity: binary_sensor.vitodens_200_wb2a_brenner_flamme
                name: Brenner
                icon: mdi:fire
                graph_entity: sensor.vitodens_200_wb2a_brenner_modulationsgrad
                show_graph_entity_state: true
                overwrite_graph_appearance: true
                graph_min: 0
                graph_max: 100
              - entity: sensor.vitodens_200_wb2a_geblaesedrehzahl_gfa_p06
                name: Gebläse P06
                icon: mdi:fan
                extra_value_entity: sensor.vitodens_200_wb2a_gfa_modulationssollwert_p09
                extra_value_name: GFA Soll
                overwrite_graph_appearance: true
                graph_min: 0
                graph_max: 6000
              - entity: sensor.vitodens_200_wb2a_rkr_kesselsolltemperatur_normal
                name: RKR Soll
                icon: mdi:target
                extra_value_entity: sensor.vitodens_200_wb2a_rkr_kesselsolltemperatur
                extra_value_name: OPT
              - entity: sensor.vitodens_200_wb2a_cfdm_kesselsolltemperatur_effektiv
                name: CFDM Soll
                icon: mdi:thermometer-check
                extra_value_entity: sensor.vitodens_200_wb2a_blr_kesselsolltemperatur_effektiv
                extra_value_name: BLR
              - entity: sensor.vitodens_200_wb2a_cfdm_leistungswert
                name: CFDM Leistung
                icon: mdi:speedometer
                extra_value_entity: sensor.vitodens_200_wb2a_gfa_leistungs_ansteuerwert_fein
                extra_value_name: GFA
                overwrite_graph_appearance: true
                graph_min: 0
                graph_max: 100
            grid_options:
              columns: full

      - type: grid
        column_span: 1
        cards:
          - type: custom:background-graph-entities
            title: Temperaturen / Hydraulik
            tile_style: true
            hours_to_show: 6
            points_per_hour: 12
            update_interval: 60
            line_width: 2
            line_opacity: 0.22
            line_length: short
            curve: spline
            show_gaps: true
            entities:
              - entity: sensor.vitodens_200_wb2a_kesseltemperatur
                name: Kessel
                icon: mdi:water-boiler
                extra_value_entity: sensor.vitodens_200_wb2a_rkr_kesselsolltemperatur_normal
                extra_value_name: Soll
              - entity: sensor.vitodens_200_wb2a_heizkreis_m1_vorlauftemperatur
                name: Vorlauf
                icon: mdi:thermometer-chevron-up
                extra_value_entity: sensor.vitodens_200_wb2a_heizkreis_m1_vorlaufsolltemperatur
                extra_value_name: Soll
              - entity: sensor.vitodens_200_wb2a_aussentemperatur
                name: Außen
                icon: mdi:home-thermometer-outline
                extra_value_entity: sensor.vitodens_200_wb2a_aussentemperatur_gedaempft
                extra_value_name: Ged.
              - entity: sensor.vitodens_200_wb2a_warmwasser_temperatur
                name: Warmwasser
                icon: mdi:water-thermometer
                extra_value_entity: sensor.vitodens_200_wb2a_warmwasser_ladestatus
                extra_value_name: Ladung
              - entity: sensor.vitodens_200_wb2a_cfdm_vorlauftemperatur
                name: CFDM Vorlauf
                icon: mdi:thermometer-lines
            grid_options:
              columns: full

      - type: grid
        column_span: 1
        cards:
          - type: custom:background-graph-entities
            title: Pumpen / Aktoren
            tile_style: true
            hours_to_show: 3
            points_per_hour: 12
            update_interval: 60
            line_width: 2
            line_opacity: 0.24
            line_length: short
            curve: spline
            show_gaps: true
            entities:
              - entity: binary_sensor.vitodens_200_wb2a_heizkreis_m1_pumpe_ausgang
                name: Heizkreispumpe
                icon: mdi:pump
                graph_entity: sensor.vitodens_200_wb2a_heizkreis_m1_pumpe_drehzahl
                show_graph_entity_state: true
                extra_value_entity: sensor.vitodens_200_wb2a_heizkreis_m1_vorlauftemperatur
                extra_value_name: VL
                overwrite_graph_appearance: true
                graph_min: 0
                graph_max: 100
              - entity: binary_sensor.vitodens_200_wb2a_interne_pumpe_status
                name: Interne Pumpe
                icon: mdi:pump
                graph_entity: sensor.vitodens_200_wb2a_interne_pumpe_drehzahl
                show_graph_entity_state: true
                extra_value_entity: sensor.vitodens_200_wb2a_umschaltventil_stellung
                extra_value_name: Ventil
                overwrite_graph_appearance: true
                graph_min: 0
                graph_max: 100
            grid_options:
              columns: full

          - type: custom:button-card
            template: diag_status
            entity: binary_sensor.vitodens_200_wb2a_zirkulationspumpe_status
            name: Zirkulation
            icon: mdi:pump
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_status
            entity: sensor.vitodens_200_wb2a_umschaltventil_stellung
            name: Umschaltventil
            icon: mdi:valve
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Freigaben / Fehler
            heading_style: subtitle
            icon: mdi:shield-check-outline
          - type: custom:button-card
            template: diag_active
            entity: binary_sensor.vitodens_200_wb2a_brenner_wiederanlauf_freigegeben
            name: Wiederanlauf
            icon: mdi:restart
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_warning
            entity: binary_sensor.vitodens_200_wb2a_brenner_taktsperre_aktiv
            name: Taktsperre
            icon: mdi:timer-lock
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_active
            entity: binary_sensor.vitodens_200_wb2a_brenner_startphase
            name: Startphase
            icon: mdi:rocket-launch
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_active
            entity: binary_sensor.vitodens_200_wb2a_brenner_regelbetrieb
            name: Regelbetrieb
            icon: mdi:tune-variant
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_active
            entity: binary_sensor.vitodens_200_wb2a_brenner_anfahroptimierung_aktiv
            name: Anfahr-OPT
            icon: mdi:chart-timeline-variant-shimmer
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_fault
            entity: binary_sensor.vitodens_200_wb2a_feuerungsautomat_verriegelt
            name: GFA Lock
            icon: mdi:alert-octagon
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_fault
            entity: binary_sensor.vitodens_200_wb2a_cfdm_fehler
            name: CFDM Fehler
            icon: mdi:alert-circle-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_fault
            entity: binary_sensor.vitodens_200_wb2a_cfdm_harte_sperre
            name: CFDM Lock
            icon: mdi:lock-alert-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_aktueller_alarm_fehlercode
            name: Alarm
            icon: mdi:alarm-light-outline
            grid_options:
              columns: 4
              rows: 1

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Interne Regelwerte
            heading_style: subtitle
            icon: mdi:flask-outline
          - type: custom:button-card
            template: diag_research
            entity: sensor.vitodens_200_wb2a_rkr_brennerzustand
            name: RKR Zustand
            icon: mdi:state-machine
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_research
            entity: sensor.vitodens_200_wb2a_cfdm_application_mode
            name: App Mode
            icon: mdi:application-cog
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_research
            entity: sensor.vitodens_200_wb2a_cfdm_consumer_demand_temperatur
            name: Demand
            icon: mdi:thermometer-auto
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_active
            entity: binary_sensor.vitodens_200_wb2a_cfdm_leistungsstatus
            name: CFDM Status
            icon: mdi:check-circle-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_research
            entity: sensor.vitodens_200_wb2a_rkr_statusbyte_55e0_b14
            name: 55E0.b14
            icon: mdi:flask-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_aktueller_gfa_fehlerstatus
            name: GFA Status
            icon: mdi:shield-check-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_eeprom_status
            name: EEPROM
            icon: mdi:memory
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_research
            entity: sensor.vitodens_200_wb2a_i2c_eeprom_gwg_flag
            name: I²C EEPROM-GWG
            icon: mdi:integrated-circuit-chip
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Sensorik / KM-BUS
            heading_style: subtitle
            icon: mdi:access-point-network
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_sensorstatus_aussentemperatur_anzeige
            name: Außenfühler
            icon: mdi:home-thermometer-outline
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_sensorstatus_kesseltemperatur_anzeige
            name: Kesselfühler
            icon: mdi:water-boiler
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_sensorstatus_sts2_anzeige
            name: STS2
            icon: mdi:thermometer-alert
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_sensorstatus_vlts_anzeige
            name: VLTS
            icon: mdi:thermometer-alert
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_sensorstatus_raum_m1_anzeige
            name: Raum M1
            icon: mdi:home-thermometer
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_heizkreis_m1_reglervariante_anzeige
            name: Reglervariante
            icon: mdi:tune
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_km_fehler_pumpe_a1
            name: KM HK-Pumpe
            icon: mdi:pump
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            template: diag_health
            entity: sensor.vitodens_200_wb2a_km_fehler_interne_pumpe
            name: KM Int. Pumpe
            icon: mdi:pump
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Fehlerhistorien
            heading_style: title
            icon: mdi:history

          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: sensor.vitodens_200_wb2a_aktueller_gfa_fehlerstatus
                icon: mdi:shield-check-outline
                content: >-
                  GFA {{ states('sensor.vitodens_200_wb2a_aktueller_gfa_fehlerstatus') }}
                icon_color: >-
                  {% set s = states('sensor.vitodens_200_wb2a_aktueller_gfa_fehlerstatus') | lower %}
                  {{ 'green' if 'kein fehler' in s or s == 'ok' else 'red' }}
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_fehlerhistorie_01_anzeige
                icon: mdi:alert-circle-outline
                content: >-
                  Letzter Systemfehler:
                  {{ states('sensor.vitodens_200_wb2a_fehlerhistorie_01_anzeige').split(' · ')[0] }}
                icon_color: orange
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.vitodens_200_wb2a_gfa_fehlerhistorie_01
                icon: mdi:chip
                content: >-
