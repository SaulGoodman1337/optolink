                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      **Funktion:** Legt die Außentemperaturgrenze für den Frostschutz des Heizkreises fest.
                      
                      **Bereich:** −9 bis +15 °C
                      
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_frostgrenze_a3_einstellung') }} °C
                      
                      Bei niedrigen Außentemperaturen kann die Regelung die Heizkreispumpe zum Frostschutz dauerhaft laufen lassen. Maßgeblich ist dabei die aktuelle Außentemperatur.
                      
                      Der Frostschutz hat Vorrang vor Sparfunktionen wie A5 und A6.
                      
                      **Hinweis:** A3 ist eine Schutzfunktion. Sehr niedrige Einstellungen nur verwenden, wenn die Leitungsführung und Frostsicherheit der Anlage bekannt sind.
                      
