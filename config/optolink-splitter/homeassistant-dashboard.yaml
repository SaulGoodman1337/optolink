button_card_templates:
  diag_status:
    section_mode: true
    show_name: true
    show_state: true
    show_icon: true
    show_units: true
    layout: icon_name_state2nd
    size: 20px
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
        - border-radius: 12px
        - border: 1px solid var(--divider-color)
        - box-shadow: none
        - padding: 6px 8px
        - background: var(--ha-card-background, var(--card-background-color))
      grid:
        - grid-template-areas: >-
            "i n" "i s"
        - grid-template-columns: 27px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 7px
      img_cell:
        - width: 25px
        - height: 25px
        - justify-content: center
        - align-items: center
      icon:
        - width: 19px
      name:
        - justify-self: start
        - align-self: end
        - color: var(--secondary-text-color)
        - font-size: 10px
        - font-weight: 500
        - line-height: 1.1
        - overflow: hidden
        - text-overflow: ellipsis
        - white-space: nowrap
      state:
        - justify-self: start
        - align-self: start
        - color: var(--primary-text-color)
        - font-size: 13px
        - font-weight: 600
        - line-height: 1.2
        - overflow: hidden
        - text-overflow: ellipsis
        - white-space: nowrap

  diag_active:
    template: diag_status
    state:
      - value: "on"
        styles:
          icon:
            - color: var(--success-color)
          card:
            - border-color: var(--success-color)
      - value: "off"
        styles:
          icon:
            - color: var(--state-inactive-color)

  diag_warning:
    template: diag_status
    state:
      - value: "on"
        styles:
          icon:
            - color: var(--warning-color)
          card:
            - border-color: var(--warning-color)
      - value: "off"
        styles:
          icon:
            - color: var(--state-inactive-color)

  diag_fault:
    template: diag_status
    state:
      - value: "on"
        styles:
          icon:
            - color: var(--error-color)
          card:
            - border-color: var(--error-color)
      - value: "off"
        styles:
          icon:
            - color: var(--success-color)

  diag_health:
    template: diag_status
    styles:
      icon:
        - color: |
            [[[
              const s = String(entity?.state ?? '').toLowerCase();
              if (s.includes('kein fehler') || s === 'ok') return 'var(--success-color)';
              if (s.includes('referenzfehler') || s.includes('warn')) return 'var(--warning-color)';
              if (s.includes('unterbrechung') || s.includes('fehler') || s.includes('störung') || s.includes('verriegelt') || s.includes('error') || s.includes('fault')) return 'var(--error-color)';
              return 'var(--primary-color)';
            ]]]
      card:
        - border-color: |
            [[[
              const s = String(entity?.state ?? '').toLowerCase();
              if (s.includes('referenzfehler') || s.includes('warn')) return 'var(--warning-color)';
              if (s.includes('unterbrechung') || s.includes('fehler') || s.includes('störung') || s.includes('verriegelt') || s.includes('error') || s.includes('fault')) return 'var(--error-color)';
              return 'var(--divider-color)';
            ]]]

  diag_research:
    template: diag_status
    styles:
      icon:
        - color: var(--primary-color)
      card:
        - border-color: var(--primary-color)

  diag_process:
    template: diag_status
    styles:
      card:
        - padding: 7px 8px
      name:
        - font-size: 10px
      state:
        - font-size: 12px
    state:
      - value: "on"
        styles:
          icon:
            - color: var(--success-color)
          card:
            - border-color: var(--success-color)
      - value: "off"
        styles:
          icon:
            - color: var(--state-inactive-color)

  diag_process_node:
    template: diag_process
    section_mode: false
    styles:
      card:
        - height: 100%
        - min-height: 54px
        - border: none
        - border-radius: 10px
        - box-shadow: none
        - padding: 6px
        - background: transparent
      grid:
        - grid-template-areas: >-
            "i" "n" "s"
        - grid-template-columns: 1fr
        - grid-template-rows: 22px min-content min-content
        - row-gap: 2px
      img_cell:
        - width: 22px
        - height: 22px
        - justify-self: center
      icon:
        - width: 19px
      name:
        - justify-self: center
        - align-self: end
        - text-align: center
        - font-size: 10px
        - line-height: 1.1
      state:
        - justify-self: center
        - align-self: start
        - text-align: center
        - font-size: 12px
        - font-weight: 700
    state:
      - value: "on"
        styles:
          card:
            - background: color-mix(in srgb, var(--success-color) 10%, transparent)
            - box-shadow: inset 0 -2px 0 var(--success-color)
          icon:
            - color: var(--success-color)
      - value: "off"
        styles:
          card:
            - background: color-mix(in srgb, var(--disabled-text-color) 5%, transparent)
          icon:
            - color: var(--state-inactive-color)

  diag_mini:
    section_mode: false
    show_icon: false
    show_name: true
    show_state: true
    show_units: true
    show_ripple: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
        - background: transparent
        - border: none
        - box-shadow: none
        - border-radius: 0
        - padding: 2px 5px
      grid:
        - grid-template-areas: >-
            "n" "s"
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content
      name:
        - justify-self: center
        - color: var(--secondary-text-color)
        - font-size: 9px
        - font-weight: 500
        - line-height: 1.1
        - text-align: center
        - white-space: normal
      state:
        - justify-self: center
        - color: var(--primary-text-color)
        - font-size: 12px
        - font-weight: 600
        - line-height: 1.15
        - text-align: center
        - white-space: normal
        - overflow-wrap: anywhere


  diag_group2:
    section_mode: true
    show_icon: false
    show_state: false
    show_name: true
    show_ripple: false
    tap_action:
      action: none
    styles:
