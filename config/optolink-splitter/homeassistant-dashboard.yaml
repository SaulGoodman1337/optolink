              {% if p | length >= 3 %}
                {% set text = p[1] %}
                {% set ts = p[2] %}
              {% elif p | length == 2 and p[1][0:4] | int(0) > 1900 %}
                {% set text = '—' %}
                {% set ts = p[1] %}
              {% elif p | length == 2 %}
