              {% set d = ['montag','dienstag','mittwoch','donnerstag','freitag','samstag','sonntag'][now().weekday()] %}
              {% set e = 'text.vitodens_200_wb2a_heizkreis_m1_zeitprogramm_' ~ d ~ '_editor' %}
              {% set s = states(e) %}
              {% set n = now().hour * 60 + now().minute %}
              {% set ns = namespace(active=false, ende='') %}
              {% for w in s.split(',') if s not in ['none','unknown','unavailable'] %}
                {% set p = w.split('-') %}
                {% if p | length == 2 %}
                  {% set a = (p[0].split(':')[0] | int) * 60 + (p[0].split(':')[1] | int) %}
                  {% set b = (p[1].split(':')[0] | int) * 60 + (p[1].split(':')[1] | int) %}
                  {% if n >= a and n < b %}{% set ns.active = true %}{% set ns.ende = p[1] %}{% endif %}
                {% endif %}
              {% endfor %}
              {{ s | replace(',', ' · ') | replace('-', '–') }}{% if ns.active %} · AKTIV bis {{ ns.ende }}{% endif %}
