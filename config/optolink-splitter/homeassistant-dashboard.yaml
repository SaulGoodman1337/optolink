  schedule_day_row:
    section_mode: true
    show_icon: false
    show_name: true
    show_state: false
    show_ripple: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    variables:
      day_index: 0
      accent: '#2196f3'
    styles:
      card:
        - border-radius: 12px
        - border: 1px solid var(--divider-color)
        - box-shadow: |
            [[[
              const today = (new Date().getDay() + 6) % 7;
              return today === Number(variables.day_index)
                ? `inset 3px 0 0 ${variables.accent}`
                : 'none';
            ]]]
        - padding: 8px 10px
        - background: var(--ha-card-background, var(--card-background-color))
      grid:
        - grid-template-areas: >-
            "n status" "times times" "timeline timeline"
        - grid-template-columns: 1fr auto
        - grid-template-rows: min-content min-content min-content
        - row-gap: 6px
      name:
        - justify-self: start
        - align-self: center
        - font-size: 12px
        - font-weight: 700
        - color: var(--primary-text-color)
      custom_fields:
        status:
          - justify-self: end
          - align-self: center
        times:
          - justify-self: stretch
          - overflow: hidden
        timeline:
          - justify-self: stretch
          - width: 100%
    custom_fields:
      status: |
        [[[
          const raw = String(entity?.state ?? '').trim();
          const lower = raw.toLowerCase();
          const intervals = [];
          if (raw && !['unknown','unavailable','none'].includes(lower)) {
            for (const part of raw.split(',')) {
              const p = part.trim();
              const m = p.match(/^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/);
              if (!m) continue;
              const a = Number(m[1]) * 60 + Number(m[2]);
              const b = Number(m[3]) * 60 + Number(m[4]);
              intervals.push([a,b,`${m[3]}:${m[4]}`]);
            }
          }
          const d = new Date();
          const today = (d.getDay() + 6) % 7;
          if (today !== Number(variables.day_index)) return '';
          const now = d.getHours() * 60 + d.getMinutes();
          const active = intervals.find(x => now >= x[0] && now < x[1]);
          if (active) {
            return `<span style="font-size:9px;font-weight:700;color:${variables.accent};">AKTIV · bis ${active[2]}</span>`;
          }
          return '<span style="font-size:9px;font-weight:700;color:var(--secondary-text-color);">HEUTE</span>';
        ]]]
      times: |
        [[[
          const raw = String(entity?.state ?? '').trim();
          const lower = raw.toLowerCase();
          if (!raw || ['unknown','unavailable'].includes(lower)) {
            return '<span style="font-size:11px;color:var(--secondary-text-color);">keine Daten</span>';
          }
          if (lower === 'none') {
            return '<span style="font-size:11px;color:var(--secondary-text-color);">keine Schaltzeit</span>';
          }
          const parts = raw.split(',').map(x => x.trim()).filter(Boolean);
          return parts.map(p =>
            `<span style="display:inline-block;margin:1px 4px 1px 0;padding:2px 7px;border-radius:999px;border:1px solid color-mix(in srgb, ${variables.accent} 32%, var(--divider-color));background:color-mix(in srgb, ${variables.accent} 10%, transparent);font-size:10px;font-weight:650;white-space:nowrap;">${p.replace('-', '–')}</span>`
          ).join('');
        ]]]
      timeline: |
        [[[
          const raw = String(entity?.state ?? '').trim();
          const lower = raw.toLowerCase();
          const spans = [];
          if (raw && !['unknown','unavailable','none'].includes(lower)) {
            for (const part of raw.split(',')) {
              const p = part.trim();
              const m = p.match(/^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/);
              if (!m) continue;
              const start = Number(m[1]) * 60 + Number(m[2]);
              const end = Number(m[3]) * 60 + Number(m[4]);
              const left = Math.max(0, Math.min(100, start / 1440 * 100));
              const width = Math.max(0, Math.min(100 - left, (end - start) / 1440 * 100));
              spans.push(`<span style="position:absolute;left:${left}%;width:${width}%;top:0;bottom:0;border-radius:999px;background:${variables.accent};"></span>`);
            }
          }
          return `<div style="position:relative;width:100%;height:7px;border-radius:999px;background:color-mix(in srgb, var(--divider-color) 75%, transparent);overflow:hidden;">${spans.join('')}</div>`;
        ]]]

views:
  - title: Heizung
    path: heizung
    icon: mdi:water-boiler
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Vitodens 200-W WB2A
            heading_style: title
            icon: mdi:fire-circle
            badges:
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_feuerungsautomat_verriegelt
                name: Störung
                icon: mdi:alert-circle
                show_state: true
                show_icon: true
                visibility:
                  - condition: state
                    entity: binary_sensor.vitodens_200_wb2a_feuerungsautomat_verriegelt
                    state: "on"
              - type: entity
                entity: binary_sensor.vitodens_200_wb2a_brenner_flamme
                name: Brenner
                icon: mdi:gas-burner
                show_state: true
                show_icon: true
              - type: entity
