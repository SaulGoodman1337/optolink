                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperatur_wohnbereich_temperature
                name: Ist
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperaturzieldario
                name: Soll
                show_state: true
                show_icon: false
          - type: heading
            heading: Schlafzimmer
            heading_style: subtitle
            icon: mdi:bed
            badges:
              - type: entity
                entity: sensor.schlafzimmer_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperatur_schlafzimmer_temperature
                name: Ist
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperaturzielschlafzimmer
                name: Soll
                show_state: true
                show_icon: false
          - type: heading
            heading: Gäste-WC
            heading_style: subtitle
            icon: mdi:toilet
            badges:
              - type: entity
                entity: sensor.gaste_wc_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperaturzielgastewc
                name: Soll
                show_state: true
                show_icon: false
          - type: heading
            heading: Badezimmer
            heading_style: subtitle
            icon: mdi:bathtub
            badges:
              - type: entity
                entity: sensor.badezimmer_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: climate.badezimmer
                name: Klima
                show_state: true
                show_icon: true
          - type: heading
            heading: Wohnzimmer
            heading_style: subtitle
            icon: mdi:sofa
            badges:
              - type: entity
                entity: sensor.wohnzimmer_links_ventil_offnungsgrad
                name: Links
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.wohnzimmer_rechts_ventil_offnungsgrad
                name: Rechts
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperatursensorwohnzimmer_temperatur
                name: Ist
                show_state: true
                show_icon: false
          - type: heading
            heading: Flur
            heading_style: subtitle
            icon: mdi:door
            badges:
              - type: entity
                entity: sensor.flur_ventil_offnungsgrad
                name: Ventil
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.flurtemperatur_flur_temperature
                name: Ist
                show_state: true
                show_icon: false
              - type: entity
                entity: sensor.temperaturzielflur
                name: Soll
                show_state: true
                show_icon: false
          - type: tile
            entity: script.climateboost
            name: Alle Ventile öffnen
            icon: mdi:heating-coil
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.climateboost
              target: {}
            grid_options:
              columns: 12
              rows: 1

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Verlauf
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            title: Heizung – 48 Stunden
            hours_to_show: 48
            entities:
              - sensor.vitodens_200_wb2a_aussentemperatur_gedaempft
              - sensor.vitodens_200_wb2a_heizkreis_m1_vorlaufsolltemperatur
              - sensor.vitodens_200_wb2a_heizkreis_m1_vorlauftemperatur
              - sensor.vitodens_200_wb2a_kesseltemperatur
