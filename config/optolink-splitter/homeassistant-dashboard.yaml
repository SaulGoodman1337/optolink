                      **Aktuell:** {{ states('number.vitodens_200_wb2a_interne_pumpe_solldrehzahl_31_einstellung') }} %

                      **Wichtig:** 31 = 100 % ist bei dieser Anlage nicht gleichbedeutend mit 100 % realer Pumpendrehzahl im Heizbetrieb. Der Wert ist daher nicht als direkter Laufzeit-Sollwert beschriftet.

                      Datenpunkt: `0x5731`
            grid_options:
              columns: 6
              rows: 2

