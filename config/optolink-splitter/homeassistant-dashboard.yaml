            entity: sensor.vitodens_200_wb2a_zeitprogramm_schreibstatus
            primary: >-
              Zeitprogramm-Schreibpfad · {{ states(entity) }}
            secondary: >-
              {% set s = states(entity) %}
              {% set msg = state_attr(entity, 'message') %}
              {% set p = state_attr(entity, 'program_label') %}
              {% set d = state_attr(entity, 'day_short') %}
              {% set z = state_attr(entity, 'schedule') %}
              {% if s == 'OK' and p and d %}
                {{ p }} · {{ d }} · {{ z }} · bytegenau bestätigt
              {% elif s == 'Fehler' and msg %}
                {{ msg }}
              {% elif s == 'Schreibt …' and p and d %}
                {{ p }} · {{ d }} · {{ z }}
              {% else %}
                Strikte Validierung · vollständiger 8-Byte-Write · Readback-Verifikation
              {% endif %}
            icon: >-
              {% set s = states(entity) %}
              {% if s == 'OK' %}mdi:check-decagram
              {% elif s == 'Fehler' %}mdi:alert-circle
              {% elif s == 'Schreibt …' %}mdi:progress-clock
              {% else %}mdi:shield-check{% endif %}
