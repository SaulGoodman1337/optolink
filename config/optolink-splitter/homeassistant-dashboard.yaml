            content: >-
              **RKR / OPT:** 55E0.b14 Bit 0 blieb in zwei kontrollierten
              Zyklen bis zum Wiederanlauf-Fenster auf 0. Mit der Freigabe auf
              1 begann die nächste Feuerungssequenz. 55E0[10:12] verhält sich
              als interner anfahroptimierter Kesselsollwert (OPT). Rohwerte
              bleiben als solche bezeichnet und werden nicht als bestätigte
              Betriebsparameter dargestellt.
