          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_sommerspar_schaltschwelle_a5_einstellung
            name: Heizkreispumpenlogik A5
            icon: mdi:radiator-disabled
            show_entity_picture: false
            vertical: false
            features:
              - type: numeric-input
                style: slider
            features_position: bottom
            grid_options:
              columns: 10
              rows: 2
          - type: button
            icon: mdi:information-outline
            show_name: false
            show_icon: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Heizkreispumpenlogik A5
                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      ## Was macht A5?
                      
                      A5 ist **kein Raumthermostat**. Die Vitodens braucht dafür keinen Raumtemperaturfühler und vergleicht auch nicht die gemessene Raumtemperatur.
                      
                      Stattdessen benutzt A5 die **eingestellte Raum-Solltemperatur als Rechengröße** und bildet daraus eine Außentemperaturgrenze für die Heizkreispumpe.
                      
                      **Formel für die Abschaltgrenze:**
                      
                      `Außen-Grenze = Raum-Soll + (6 − A5) K`
                      
                      Wird die Außentemperatur größer als diese Grenze, schaltet die Vitodens die **Heizkreispumpe aus**.
                      
                      **Bereich:** 0–15  
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_sommerspar_schaltschwelle_a5_einstellung') }}
                      
                      {% set v = states('number.vitodens_200_wb2a_heizkreis_m1_sommerspar_schaltschwelle_a5_einstellung') | int(-1) %}{% if v == 0 %}**Aktuelle Bedeutung:** A5 ist deaktiviert.{% elif v >= 1 and v <= 15 %}{% set o = 6 - v %}**Aktuelle Bedeutung:** Heizkreispumpe AUS bei Außen > Raum-Soll {% if o > 0 %}+ {{ o }} K{% elif o == 0 %}{% else %}− {{ -o }} K{% endif %}.{% endif %}
                      
                      **Beispiel mit A5 = 5:**
                      
                      - Raum-Soll 20 °C → Pumpe AUS bei Außen > 21 °C
                      - Raum-Soll 18 °C → Pumpe AUS bei Außen > 19 °C
                      - Raum-Soll 16 °C → Pumpe AUS bei Außen > 17 °C
                      
                      Genau deshalb hängt A5 an der Raum-Solltemperatur: Beim Wechsel von Normal- auf reduzierten Betrieb verschiebt sich auch die Pumpen-Abschaltgrenze.
                      
                      ## A5 und A6 sind zwei verschiedene Abschaltungen
                      
                      **A5 = relative Pumpenabschaltung**
                      
                      - Grenze hängt von der gerade wirksamen Raum-Solltemperatur ab
                      - verwendet die Außentemperatur
                      - schaltet laut Codierung die **Heizkreispumpe** aus
                      - verändert nicht den A6-Wert
                      
                      **A6 = absolute Heizgrenze**
                      
                      - fester Temperaturwert, unabhängig vom Raum-Soll
                      - verwendet ausdrücklich die **gedämpfte Außentemperatur**
                      - schaltet **Brenner und Heizkreispumpe** aus
                      
                      Beide Funktionen laufen **parallel**. Es gibt keine Reihenfolge „erst A5, dann A6“.
                      
                      Beispiel: Raum-Soll 20 °C, A5 = 5, A6 = 18 °C:
                      
                      - A5: Pumpe AUS, sobald Außen > 21 °C
                      - A6: Brenner + Pumpe AUS, sobald die gedämpfte Außentemperatur > 19 °C
                      
                      Je nach Wetterverlauf kann also A5 oder A6 zuerst greifen.
                      
                      Frostschutz über A3 kann die Sparabschaltung übersteuern.
                      
                      Datenpunkt: `0x27A5`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
          - type: tile
            entity: number.vitodens_200_wb2a_heizkreis_m1_sommersparabschaltung_a6_einstellung
