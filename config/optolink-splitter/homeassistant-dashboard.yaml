                  adaptive: true
                  content:
                    type: markdown
                    content: |
                      ## Was macht A6?
                      
                      **Merksatz:** A6 ist die feste Heizgrenze für den gesamten Heizbetrieb; A5 entscheidet dagegen nur über die Heizkreispumpe anhand einer vom Raum-Soll abhängigen Grenze.
                      
                      A6 ist die **absolute Sommer-/Winter-Heizgrenze** der Vitodens.
                      
                      Anders als A5 hängt diese Grenze **nicht von der Raum-Solltemperatur** ab. A6 wird direkt als Temperaturgrenze eingestellt.
                      
                      **Bereich:** 5–36 °C  
                      **Aktuell:** {{ states('number.vitodens_200_wb2a_heizkreis_m1_sommersparabschaltung_a6_einstellung') }} °C
                      
                      {% set v = states('number.vitodens_200_wb2a_heizkreis_m1_sommersparabschaltung_a6_einstellung') | int(-1) %}{% if v == 36 %}**Aktuelle Bedeutung:** Erweiterte Sparschaltung deaktiviert.{% elif v >= 5 and v <= 35 %}**Aktuelle Bedeutung:** Brenner und Heizkreispumpe AUS, wenn die gedämpfte Außentemperatur > {{ v + 1 }} °C ist.{% endif %}
                      
                      Beispiel: A6 = 18 °C → Abschaltung bei gedämpfter Außentemperatur > 19 °C.
                      
                      **Warum gedämpfte Außentemperatur?**  
                      Die Regelung reagiert damit nicht sofort auf einen einzelnen warmen Nachmittag. Die gedämpfte Außentemperatur berücksichtigt die thermische Trägheit eines durchschnittlichen Gebäudes.
                      
                      ## Unterschied zu A5
                      
                      - **A5:** variable Grenze = Raum-Soll +/− Offset → nur Heizkreispumpe
                      - **A6:** feste absolute Grenze → Brenner + Heizkreispumpe
                      - **A5:** hängt vom Normal-/Reduziert-Sollwert ab
                      - **A6:** unabhängig vom Raum-Soll
                      - Beide Funktionen wirken unabhängig voneinander.
                      
                      Frostschutz über A3 kann die Sparabschaltung übersteuern.
                      
                      Datenpunkt: `0x27A6`
            hold_action:
              action: none
            grid_options:
              columns: 2
              rows: 2
