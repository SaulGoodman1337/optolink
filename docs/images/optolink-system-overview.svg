<rect x="760" y="450" width="380" height="94" rx="17" class="card"/>
<!-- simplified linux icon -->
<circle cx="804" cy="478" r="15" fill="#111827"/><ellipse cx="804" cy="510" rx="22" ry="27" fill="#111827"/><ellipse cx="804" cy="508" rx="13" ry="18" fill="#facc15"/><circle cx="798" cy="476" r="3" fill="#fff"/><circle cx="810" cy="476" r="3" fill="#fff"/>
<text x="845" y="476" class="label">Linux / LXC: optolink-splitter</text>
<text x="845" y="501" class="small">/dev/serial/by-id/...</text>
<text x="845" y="525" class="tiny">Einzige Komponente mit direktem Zugriff auf den seriellen Port.</text>

<rect x="1160" y="461" width="198" height="72" rx="14" fill="#f3f9ff" stroke="#79bde9"/>
<circle cx="1185" cy="487" r="13" fill="#1983d7"/><text x="1185" y="493" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">i</text>
<text x="1206" y="482" class="tiny">Der Splitter spricht</text><text x="1206" y="501" class="tiny">über MQTT mit allen</text><text x="1206" y="520" class="tiny">Zusatzdiensten.</text>

<rect x="95" y="575" width="1270" height="168" rx="18" class="dash"/>
<text x="115" y="599" class="label">Zusatzdienste <tspan font-weight="500">(im selben Host / LXC)</tspan></text>

