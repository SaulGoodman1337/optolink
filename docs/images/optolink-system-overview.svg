<!-- 3 USB / Host -->
<rect x="20" y="420" width="1408" height="350" rx="25" fill="url(#g3)" stroke="#80c6f0"/>
<circle cx="62" cy="462" r="27" fill="#0c75c8" filter="url(#soft)"/><text x="62" y="472" text-anchor="middle" class="step">3</text>
