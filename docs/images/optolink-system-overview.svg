<rect x="835" y="615" width="220" height="105" rx="15" fill="#f0fdf4" stroke="#86d995" class="svc"/>
<circle cx="869" cy="650" r="22" fill="#16a34a"/><circle cx="869" cy="650" r="12" fill="none" stroke="#fff" stroke-width="3"/><path d="M869 650 V642 M869 650 L876 655" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="900" y="645" class="label">clock-sync</text><text x="900" y="670" class="small">Systemzeit</text><text x="900" y="696" class="tiny">Gerätezeit synchronisieren</text>

<rect x="1075" y="615" width="265" height="105" rx="15" fill="#f8fafc" stroke="#aeb9c5" class="svc"/>
