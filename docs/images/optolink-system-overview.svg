<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
<title id="title">Optolink-Splitter Systemübersicht</title>
<desc id="desc">Vom Viessmann Heizgerät über Optolink, USB, Linux/LXC und MQTT bis Home Assistant.</desc>
<defs>
  <linearGradient id="g1" x1="0" x2="1"><stop stop-color="#fff7f7"/><stop offset="1" stop-color="#fff0f0"/></linearGradient>
  <linearGradient id="g2" x1="0" x2="1"><stop stop-color="#fffaf1"/><stop offset="1" stop-color="#fff3df"/></linearGradient>
  <linearGradient id="g3" x1="0" x2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#e7f4ff"/></linearGradient>
  <linearGradient id="g4" x1="0" x2="1"><stop stop-color="#effdf3"/><stop offset="1" stop-color="#e8faee"/></linearGradient>
  <linearGradient id="g5" x1="0" x2="1"><stop stop-color="#f2f9ff"/><stop offset="1" stop-color="#e8f5ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".08"/></filter>
  <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1685d8"/></marker>
  <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0aa15b"/></marker>
  <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker>
  <style>
    .title{font:800 43px Inter,Segoe UI,Arial,sans-serif;fill:#0b1f44;letter-spacing:-1px}
    .subtitle{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#294b7a}
    .section{font:800 29px Inter,Segoe UI,Arial,sans-serif;fill:#102a56}
    .section-red{font:800 28px Inter,Segoe UI,Arial,sans-serif;fill:#a11d14}
    .section-orange{font:800 28px Inter,Segoe UI,Arial,sans-serif;fill:#8c2218}
    .body{font:18px Inter,Segoe UI,Arial,sans-serif;fill:#244267}
    .label{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#0f2855}
    .small{font:16px Inter,Segoe UI,Arial,sans-serif;fill:#385477}
    .tiny{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#49627e}
    .white{fill:#fff}
    .card{fill:#fff;stroke:#8ec5ee;stroke-width:1.5;filter:url(#soft)}
    .card-orange{fill:#fff;stroke:#f6a037;stroke-width:1.5;filter:url(#soft)}
    .svc{stroke-width:1.4;filter:url(#soft)}
    .step{font:800 28px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
    .arrow-blue{stroke:#1685d8;stroke-width:5;fill:none;marker-end:url(#blueArrow)}
    .arrow-green{stroke:#0aa15b;stroke-width:5;fill:none;marker-end:url(#greenArrow)}
    .arrow-orange{stroke:#f97316;stroke-width:5;fill:none;marker-end:url(#orangeArrow)}
    .dash{fill:none;stroke:#67b9ef;stroke-width:1.5;stroke-dasharray:6 5}
  </style>
</defs>

<rect width="1448" height="1086" fill="#ffffff"/>
<text x="724" y="48" text-anchor="middle" class="title">Optolink-Splitter Systemübersicht</text>
<text x="724" y="82" text-anchor="middle" class="subtitle">Vom Heizgerät bis Home Assistant</text>

<!-- 1 Heizgerät -->
<rect x="20" y="105" width="1408" height="125" rx="25" fill="url(#g1)" stroke="#ff9b96"/>
<circle cx="62" cy="145" r="27" fill="#f04d3d" filter="url(#soft)"/><text x="62" y="155" text-anchor="middle" class="step">1</text>
<text x="105" y="145" class="section-red">Heizgerät</text>
<text x="106" y="174" class="body">Viessmann Heizgerät mit</text>
<text x="106" y="198" class="body">Optolink-Service-Schnittstelle.</text>

<rect x="450" y="114" width="530" height="104" rx="18" class="card-orange"/>
