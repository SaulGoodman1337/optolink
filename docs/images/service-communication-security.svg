<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Dienstekommunikation und Sicherheitsmodell</title>
<desc id="desc">MQTT-Zusatzdienste kommunizieren über den optolink-splitter; nur der Splitter öffnet den seriellen Port.</desc>
<defs>
  <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
  <style>
    .title{font:700 36px Arial,sans-serif;fill:#172554}.sub{font:21px Arial,sans-serif;fill:#475569}
    .h{font:700 22px Arial,sans-serif;fill:#111827}.label{font:700 17px Arial,sans-serif;fill:#111827}
    .text{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}
    .client{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.safe{fill:#fff1f2;stroke:#fda4af;stroke-width:2}.rule{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}
    .blue{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#ab)}.green{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#ag)}
  </style>
</defs>
<rect width="1440" height="900" fill="#fff"/>
<text x="720" y="48" text-anchor="middle" class="title">Dienstekommunikation und Sicherheitsmodell</text>
<text x="720" y="78" text-anchor="middle" class="sub">Wie die Komponenten miteinander sprechen</text>

<rect x="25" y="110" width="330" height="650" rx="20" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
<text x="50" y="145" class="h">Clients und Dienste</text><text x="50" y="170" class="text">Sprechen über MQTT mit dem System</text>
<g>
<rect x="45" y="195" width="290" height="60" rx="12" class="client"/><text x="65" y="222" class="label">Home Assistant Dashboard</text><text x="65" y="243" class="small">Visualisierung und Bedienung</text>
<rect x="45" y="270" width="290" height="60" rx="12" class="client"/><text x="65" y="297" class="label">Automationen</text><text x="65" y="318" class="small">Regeln und Zeitsteuerung</text>
<rect x="45" y="345" width="290" height="60" rx="12" class="client"/><text x="65" y="372" class="label">optolink-maintenance</text><text x="65" y="393" class="small">CLI / manuelle Wartung</text>
<rect x="45" y="420" width="290" height="60" rx="12" class="client"/><text x="65" y="447" class="label">optolink-maintenance-api</text><text x="65" y="468" class="small">programmatischer Zugriff</text>
<rect x="45" y="495" width="290" height="60" rx="12" class="client"/><text x="65" y="522" class="label">optolink-schedule-manager</text><text x="65" y="543" class="small">Zeitprogramme</text>
<rect x="45" y="570" width="290" height="60" rx="12" class="client"/><text x="65" y="597" class="label">optolink-party-emulator</text><text x="65" y="618" class="small">Party + Restore</text>
<rect x="45" y="645" width="138" height="60" rx="12" class="client"/><text x="60" y="672" class="label">clock-sync</text><text x="60" y="693" class="small">Systemzeit</text>
<rect x="197" y="645" width="138" height="60" rx="12" class="client"/><text x="210" y="672" class="label">service-programs</text><text x="210" y="693" class="small">2F: Befüllen / Entlüften</text>
<rect x="45" y="720" width="290" height="34" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="65" y="742" class="text">optolink-debug - Diagnose</text>
</g>

<rect x="405" y="315" width="190" height="120" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="500" y="350" text-anchor="middle" class="h">MQTT-Broker</text><text x="500" y="377" text-anchor="middle" class="text">gemeinsamer Befehls-</text><text x="500" y="400" text-anchor="middle" class="text">und Antwortbus</text>
<path d="M355 365 H395" class="blue"/><path d="M395 395 H365" class="green"/>

<rect x="650" y="245" width="320" height="260" rx="22" fill="#fff1f2" stroke="#ef4444" stroke-width="3"/>
<text x="810" y="285" text-anchor="middle" class="h">optolink-splitter</text>
<rect x="690" y="305" width="240" height="75" rx="14" fill="#fee2e2" stroke="#ef4444"/><text x="810" y="332" text-anchor="middle" class="label">Einzige Komponente</text><text x="810" y="355" text-anchor="middle" class="text">mit direktem Zugriff auf den</text><text x="810" y="375" text-anchor="middle" class="text">seriellen Optolink-Port</text>
<text x="810" y="420" text-anchor="middle" class="text">Empfängt MQTT-Befehle,</text><text x="810" y="443" text-anchor="middle" class="text">führt sichere Operationen aus</text><text x="810" y="466" text-anchor="middle" class="text">und kommuniziert mit dem Gerät.</text>
<path d="M595 350 H640" class="blue"/><path d="M640 405 H605" class="green"/><text x="610" y="335" class="small">Commands</text><text x="605" y="425" class="small">State / Responses</text>

<rect x="1030" y="275" width="140" height="110" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="1100" y="315" text-anchor="middle" class="label">USB-Seriell</text><text x="1100" y="340" text-anchor="middle" class="text">Adapter</text><text x="1100" y="365" text-anchor="middle" class="small">CP2102 / FTDI</text>
<rect x="1210" y="275" width="150" height="110" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="1285" y="315" text-anchor="middle" class="label">Optolink-Kopf</text><text x="1285" y="340" text-anchor="middle" class="text">P300</text><text x="1285" y="365" text-anchor="middle" class="small">optisch</text>
<rect x="1210" y="425" width="150" height="110" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1285" y="465" text-anchor="middle" class="label">Vitodens 200-W</text><text x="1285" y="490" text-anchor="middle" class="text">WB2A</text><text x="1285" y="515" text-anchor="middle" class="small">Heizungsanlage</text>
<path d="M970 330 H1020" class="blue"/><text x="980" y="315" class="small">USB-Seriell</text>
<path d="M1170 330 H1200" class="blue"/><text x="1178" y="315" class="small">Optolink</text>
<path d="M1285 385 V415" class="blue"/>

<rect x="390" y="570" width="520" height="285" rx="20" class="safe"/>
<text x="420" y="610" class="h">Geschützte Write-Pfade</text><text x="420" y="635" class="text">Schreibende Operationen werden begrenzt und verifiziert.</text>
<text x="425" y="680" class="label">1  Zeitprogramme</text><text x="455" y="702" class="small">kompletter 8-Byte-Block + Readback + Restore</text>
<text x="425" y="738" class="label">2  Wartung</text><text x="455" y="760" class="small">Bestätigung + Lock + Readback</text>
<text x="425" y="796" class="label">3  Party</text><text x="455" y="818" class="small">Emulation + Wiederherstellung des Ursprungszustands</text>
<text x="670" y="680" class="label">4  Systemzeit</text><text x="700" y="702" class="small">Drift prüfen + 0x088E + Readback</text>
<text x="670" y="738" class="label">5  Serviceprogramme</text><text x="700" y="760" class="small">2F / 0x572F: nur 0,1,2 + Readback + Restore</text>

<rect x="935" y="570" width="465" height="285" rx="20" class="rule"/>
<text x="965" y="610" class="h">Wichtige Regeln</text>
<text x="965" y="655" class="label">1  Kein Zusatzdienst öffnet den seriellen Port direkt</text><text x="990" y="678" class="small">Nur optolink-splitter besitzt USB/Optolink.</text>
<text x="965" y="718" class="label">2  MQTT ist der gemeinsame Befehls-/Antwortbus</text><text x="990" y="741" class="small">Dienste korrelieren Antworten nach Adresse.</text>
<text x="965" y="781" class="label">3  Readback ist wichtiger als ein Transport-ACK</text><text x="990" y="804" class="small">Erfolg wird am Controllerzustand geprüft.</text>
<text x="965" y="844" class="label">4  Home Assistant zeigt nur freigegebene Funktionen</text>
</svg>