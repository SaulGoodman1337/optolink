name: Validate WB2A P300 RPM Trigger Crosscheck

on:
  push:
    branches: [optolink-p300-migration]
    paths:
      - 'tools/wb2a-p300-rpm-trigger.py'
      - 'tools/wb2a-p300-rpm-trigger.sh'
      - 'tests/test_p300_rpm_trigger.py'
      - 'docs/p300-rpm-trigger-runbook-2026-10-09.md'
      - '.github/workflows/validate-p300-rpm-trigger.yml'
  pull_request:
    paths:
      - 'tools/wb2a-p300-rpm-trigger.py'
      - 'tools/wb2a-p300-rpm-trigger.sh'
      - 'tests/test_p300_rpm_trigger.py'
      - '.github/workflows/validate-p300-rpm-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-rpm-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and inert plan
        run: |
          python -m py_compile tools/wb2a-p300-rpm-trigger.py tests/test_p300_rpm_trigger.py
          bash -n tools/wb2a-p300-rpm-trigger.sh
          python tools/wb2a-p300-rpm-trigger.py | grep -F 'PLAN ONLY:'
      - name: Trigger-only offline guards
        run: python -m unittest discover -s tests -p test_p300_rpm_trigger.py -v
      - name: Existing read-only transport and recovery tests
        run: |
          python -m unittest discover -s tests -p test_p300_temporal_logger.py -v
          python -m unittest discover -s tests -p test_p300_p06_focus.py -v
          python -m unittest discover -s tests -p test_p300_fullram_logger.py -v
          python -m unittest discover -s tests -p test_p300_deep_logger.py -v
      - name: Assert exact high-RAM trigger and no-write packet whitelist
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location(
              't','tools/wb2a-p300-rpm-trigger.py')
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert m.ALLOWED_P300_SPECS == frozenset((
              (1,0x55d3,11),(3,0x0f20,32),(3,0x1c60,32)))
          assert m.TRIGGER_RAW_MIN==0x88
          assert m.MAX_TRIGGERS==4
          assert m.TRIGGER_COOLDOWN_SECONDS==600
          assert m.UNIT != m.T.UNIT
          assert all(x[0] in (1,3) for x in m.ALLOWED_P300_SPECS)
          for forbidden in ((4,0x0f20,32),(7,0x4006,1),
                            (9,0x4006,1),(201,0x4006,1),
                            (3,0x03ae,1),(3,0x0f00,32)):
              try: m.frame(forbidden)
              except ValueError: pass
              else: raise AssertionError("unreviewed hardware command allowed")
          print('RPM_TRIGGER_ALLOWLIST_NO_WRITE_PASS')
          PY
