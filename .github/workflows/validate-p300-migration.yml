name: Validate P300 Migration

on:
  push:
    branches: [optolink-p300-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p300-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned upstream fixture
        uses: actions/checkout@v4
        with:
          repository: philippoo66/optolink-splitter
          ref: c1ee204a1421447721603c5f21c6da7337fdac97
          path: .p300-upstream
          persist-credentials: false
      - name: Build reproducible source fixture (no credentials or git metadata)
        run: |
          mkdir -p /tmp/p300-fixture/project /tmp/p300-fixture/upstream
          git archive HEAD | tar -x -C /tmp/p300-fixture/project
          git -C .p300-upstream archive HEAD | tar -x -C /tmp/p300-fixture/upstream
          printf '%s\n' "project=${GITHUB_SHA}" "upstream=c1ee204a1421447721603c5f21c6da7337fdac97" > /tmp/p300-fixture/refs.txt
          tar -czf /tmp/p300-source-fixture.tar.gz -C /tmp/p300-fixture .
      - uses: actions/upload-artifact@v4
        with:
          name: p300-source-fixture
          path: /tmp/p300-source-fixture.tar.gz
          retention-days: 7
      - name: Install offline-test dependencies
        run: python3 -m pip install --disable-pip-version-check pyserial paho-mqtt pyyaml
      - name: Validate reversible read-only systemd canary
        run: |
          bash -n tools/optolink-p300-trial.sh
          grep -Fq 'systemd-run --quiet' tools/optolink-p300-trial.sh
          grep -Fq 'p300_virtual_write=False' tools/optolink-p300-trial.sh
          grep -Fq 'p300_ram_read=False' tools/optolink-p300-trial.sh
          grep -Fq '/run/systemd/system' tools/optolink-p300-trial.sh
          grep -Fq 'P300_CANDIDATE_PREFLIGHT=PASS' tools/optolink-p300-trial.sh
          test -f docs/p300-trial-install-rollback.md
      - name: Run required P300 regression tests
        env:
          P300_UPSTREAM_ROOT: ${{ github.workspace }}/.p300-upstream
        run: python3 tools/test-p300-migration.py --report /tmp/p300-test-report.json
      - name: Upload offline validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p300-test-report
          path: /tmp/p300-test-report.json
          if-no-files-found: error
          retention-days: 14
